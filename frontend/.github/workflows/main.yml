name: Build APK
on: push

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm' # Caching speeds up subsequent runs

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Install Android NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Install Dependencies and Build Frontend
        run: |
          npm install
          # Angular build is required so Tauri has web assets to bundle
          npm run build 

      - name: Build APK
        run: |
          # Ensure Android project is initialized (non-interactive)
          npx tauri android init --force 
          
          # Proguard Setup
          PROGUARD_PATH="src-tauri/gen/android/app/proguard-rules.pro"
          mkdir -p $(dirname "$PROGUARD_PATH")
          echo "-keep class app.tauri.** { *; }" > $PROGUARD_PATH
          echo "-keep class com.tapah.app.** { *; }" >> $PROGUARD_PATH
          
          # Build the APK (Note: --no-dev if you want a release build)
          npx tauri android build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: src-tauri/gen/android/**/build/outputs/apk/**/*.apk
          if-no-files-found: error